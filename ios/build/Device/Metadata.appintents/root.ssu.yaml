apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: com.iris.ios.assistant
    intents:
    - metadata:
        name: StartListeningIntent_0
        title: Start Iris Voice Agent
      corpuses:
        training:
        - locale: en
          utterances:
          - Start ${+applicationName} Voice Agent
          - Ask ${+applicationName}
          - Hey ${+applicationName}
          - Start ${+applicationName}
          - ${+applicationName}
    - metadata:
        name: AskIRISIntent_1
        title: Ask IRIS
      corpuses:
        training:
        - locale: en
          utterances:
          - Talk to ${+applicationName}
          - Wake ${+applicationName}
    - metadata:
        name: AskIRISWithTextIntent_2
        title: Ask IRIS with Text
      corpuses:
        training:
        - locale: en
          utterances:
          - Tell ${+applicationName} to ${command}
          - Ask ${+applicationName} to ${command}
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: en
          utterances:
          - ${+standardAppShortcutNegatives}
variables:
- name: +applicationName
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
    - IRIS-I
- name: +prefix
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/prefix/en.yaml
- name: +standardAppShortcutNegatives
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/en.yaml
