name: macOS iOS Simulator Build & XCTest Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (macOS 14 / Xcode 15+)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Active Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
          xcodebuild -version
          swift --version

      - name: Cache Native llama.xcframework
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: ios/Frameworks/llama.xcframework
          key: llama-xcframework-b4500-v2-${{ runner.os }}-${{ hashFiles('ios/build_native_llama.sh', 'ios/build-xcframework.sh') }}

      - name: Compile Native llama.xcframework (if cache miss)
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          cd ios
          chmod +x build_native_llama.sh build-xcframework.sh
          ./build_native_llama.sh

      - name: Verify llama.xcframework Layout
        run: |
          ls -la ios/Frameworks/llama.xcframework
          plutil -lint ios/Frameworks/llama.xcframework/Info.plist

      - name: Build IRIS-I Application (iOS Simulator)
        run: |
          cd ios
          xcodebuild clean build \
            -project IRIS-I.xcodeproj \
            -scheme IRIS-I \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run Native XCTest Suite (iOS Simulator)
        run: |
          cd ios
          xcodebuild test \
            -project IRIS-I.xcodeproj \
            -scheme IRIS-I \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
